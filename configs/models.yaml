models:
  - id: reasoning
    runtime: ollama
    model: qwen3:14b
    capabilities: [reasoning, planning, tool_calling]
    modalities: [text]
    priority: 10
    enabled: true
  - id: reasoning-fallback
    runtime: ollama
    model: qwen3:8b
    capabilities: [reasoning, planning]
    modalities: [text]
    priority: 5
    enabled: true
  - id: coding
    runtime: ollama
    model: qwen2.5-coder:14b
    capabilities: [coding, debugging, tool_calling]
    modalities: [text]
    priority: 10
    enabled: true
  - id: vision
    runtime: ollama
    model: qwen2.5-vl:7b
    capabilities: [vision, document_understanding]
    modalities: [text, image, document]
    priority: 10
    enabled: true
